name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: windows-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: gate tests
        shell: bash
        run: scripts/test.sh

  browser:
    # The recorded results need Japanese as the display language, because pages that leave the
    # font to the system get the system's choice. macOS runners are switched to Japanese below.
    # Windows runners have no Japanese fonts and no Japanese display language, so the Windows
    # browser eval stays a run by hand (docs/results.md); the Windows gate runs above.
    name: browser eval macos-latest
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Japanese as the display language
        run: defaults write -g AppleLanguages -array ja en && defaults read -g AppleLanguages
      - name: install the bundled browser
        run: uv run --quiet --no-project --with-requirements requirements-browser.txt playwright install chromium-headless-shell
      - name: known-answer pages in a real browser
        run: scripts/eval.sh

  package:
    name: build, install, run the installed command
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Japanese as the display language
        run: defaults write -g AppleLanguages -array ja en
      - name: install the bundled browser
        run: uv run --quiet --no-project --with-requirements requirements-browser.txt playwright install chromium-headless-shell
      - name: end-to-end check of the installed wheel
        run: scripts/e2e.sh
