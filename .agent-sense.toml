# Settings for agent-sense, the author's own unpublished tool for checking agent work.
# Optional: nothing in this file is needed to use or develop cjk-sense, and it can be ignored.
[done]
test = "scripts/test.sh"
ignore = ["features.json"]   # verification writes states here; that does not make the test run stale

[hook]
checks = ["done"]   # checks the Stop hook runs; it blocks only on a failing finding

[all]
checks = ["done", "deps", "context", "boundary"]
